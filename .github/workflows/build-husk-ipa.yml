name: Build Husk IPA

# Builds this repository's Husk source with the previously verified staging approach.
# Avoids recompiling WebKit ANGLE (which fails on the hosted compiler).
on:
  push:
    branches: [codex/dungeons-efficient-native]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/tag/SHA (must include the Dungeons sharp and efficiency changes)"
        required: true
        default: codex/dungeons-efficient-native
        type: string

permissions:
  contents: read

concurrency:
  group: husk-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Check out Husk fork
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Verify sharp-resolution source and run regression checks
        shell: bash
        run: |
          set -euo pipefail
          # Refuse main/old PR branches that predate the integrated graphics fixes.
          if ! git merge-base --is-ancestor 6c74b72b000cbb5bd5f0dce2b6343fc9a9a95337 HEAD; then
            echo "::error::Selected source lacks the integrated Dungeons graphics/efficiency changes. Use codex/dungeons-efficient-native or a descendant."
            exit 1
          fi
          python3 tests/translation-layer/test_ue4_graphics.py -v
          python3 tests/translation-layer/test_ue4_resolution_hook.py -v
          python3 tests/translation-layer/test_source_efficiency.py -v
          python3 tests/translation-layer/test_compat_sync.py -v
          python3 tests/translation-layer/test_thread_policy.py -v
          python3 tests/translation-layer/test_vk_frame_timing.py -v
          python3 tests/translation-layer/test_present_clock.py -v
          python3 tests/translation-layer/test_pipeline_store.py -v
          python3 tests/translation-layer/test_driver_profile.py -v
          python3 tests/translation-layer/test_efficiency.py -v
          python3 tests/translation-layer/test_cpu_threads.py -v
          python3 tests/translation-layer/test_efficiency_math.py -v
          python3 tests/translation-layer/test_pipeline_diagnostics.py -v
          python3 tests/translation-layer/test_pipeline_feedback.py -v
          python3 tests/translation-layer/test_game_chrome.py -v
          python3 tests/translation-layer/test_gpu_timing.py -v
          python3 tests/translation-layer/test_gpu_metal.py -v
          python3 tests/translation-layer/test_gpu_vk_queue.py -v
          python3 tests/translation-layer/test_render_inventory.py -v
          python3 tests/translation-layer/test_efficiency_analysis.py -v
          python3 tests/translation-layer/test_roadmap_progress.py -v
          python3 tests/translation-layer/test_roadmap_projection.py -v
          python3 tests/translation-layer/test_comparison_campaign.py -v
          python3 tests/translation-layer/test_spatial.py -v
          python3 tests/translation-layer/test_spatial_lifetime.py -v
          {
            echo "## Husk IPA source"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Sharp native-resolution and efficiency regression checks passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version

      - name: Download verified official base libraries and game resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --location --retry 3 \
            https://github.com/Leviidev/Husk/releases/download/3.0/Husk.ipa \
            --output build/Husk-3.0-base.ipa
          # Verifies the SHA256 and stages dependencies only, not the donor app executable.
          python3 scripts/stage_graphics_build.py build/Husk-3.0-base.ipa

      - name: Build separate pinned MetalFX experimental driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bash scripts/build_spatial_moltenvk_ios.sh 2>&1 | tee build/logs/spatial-driver.log

      - name: Install Rust iOS target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Cache Rust pairing dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rppairing-ios/target
          key: husk-pairing-${{ runner.os }}-${{ hashFiles('src/rppairing-ios/Cargo.lock') }}

      - name: Build pairing library
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_rppairing_ios.sh

      - name: Build this fork's Husk app and package IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package_ipa.sh "$PWD/build/Husk.ipa"
          test -s build/Husk.ipa
          ls -lh build/Husk.ipa

      - name: Upload the installable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-LiveContainer-IPA
          path: build/Husk.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: husk-build-logs
          path: |
            /tmp/husk_ipa/build.log
            build/logs/
          if-no-files-found: ignore
          retention-days: 7
