name: Build Husk IPA

# Builds this repository's Husk source with the previously verified staging approach.
# Avoids recompiling WebKit ANGLE (which fails on the hosted compiler).
on:
  push:
    branches: [codex/dungeons-efficient-native, codex/husk31-compatible]
  pull_request:
    branches: [codex/husk31-compatible]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/tag/SHA (must include the Dungeons sharp and efficiency changes)"
        required: true
        default: codex/dungeons-efficient-native
        type: string

permissions:
  contents: read

concurrency:
  # Capacity-stalled Arm runs must not hold the Intel fallback's concurrency slot.
  group: husk-ipa-intel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS IPA
    # Hosted Arm capacity failed before runner assignment in40357300459/40359358563.
    # Intel runs the same Apple SDK checks and cross-compiles the arm64 iOS IPA.
    runs-on: macos-26-intel
    timeout-minutes: 120

    steps:
      - name: Check out Husk fork
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Verify sharp-resolution source and run regression checks
        shell: bash
        run: |
          set -euo pipefail
          # Refuse main/old PR branches that predate the integrated graphics fixes.
          if ! git merge-base --is-ancestor 6c74b72b000cbb5bd5f0dce2b6343fc9a9a95337 HEAD; then
            echo "::error::Selected source lacks the integrated Dungeons graphics/efficiency changes. Use codex/dungeons-efficient-native or a descendant."
            exit 1
          fi
          python3 tests/translation-layer/test_ue4_graphics.py -v
          python3 tests/translation-layer/test_ue4_resolution_hook.py -v
          python3 tests/translation-layer/test_source_efficiency.py -v
          python3 tests/translation-layer/test_runtime_input_vulkan.py -v
          python3 tests/translation-layer/test_compat_sync.py -v
          python3 tests/translation-layer/test_publication_wait.py -v
          python3 tests/translation-layer/test_queue_options.py -v
          python3 tests/translation-layer/test_swapchain_budget.py -v
          python3 tests/translation-layer/test_thread_policy.py -v
          python3 tests/translation-layer/test_vk_frame_timing.py -v
          python3 tests/translation-layer/test_present_clock.py -v
          python3 tests/translation-layer/test_pipeline_store.py -v
          python3 tests/translation-layer/test_component_profile.py -v
          python3 tests/translation-layer/test_component_triage.py -v
          python3 tests/translation-layer/test_device_profiles.py -v
          python3 tests/translation-layer/test_driver_profile.py -v
          python3 tests/translation-layer/test_efficiency.py -v
          python3 tests/translation-layer/test_process_metrics.py -v
          python3 tests/translation-layer/test_cpu_threads.py -v
          python3 tests/translation-layer/test_efficiency_math.py -v
          python3 tests/translation-layer/test_pipeline_core_state.py -v
          python3 tests/translation-layer/test_pipeline_diagnostics.py -v
          python3 tests/translation-layer/test_pipeline_feedback.py -v
          python3 tests/translation-layer/test_game_chrome.py -v
          python3 tests/translation-layer/test_gpu_timing.py -v
          python3 tests/translation-layer/test_gpu_metal.py -v
          python3 tests/translation-layer/test_gpu_vk_queue.py -v
          python3 tests/translation-layer/test_render_inventory.py -v
          python3 tests/translation-layer/test_efficiency_analysis.py -v
          python3 tests/translation-layer/test_roadmap_progress.py -v
          python3 tests/translation-layer/test_roadmap_projection.py -v
          python3 tests/translation-layer/test_comparison_campaign.py -v
          python3 tests/translation-layer/test_external_efficiency.py -v
          python3 tests/translation-layer/test_spatial.py -v
          python3 tests/translation-layer/test_spatial_lifetime.py -v
          python3 tests/translation-layer/test_native_archive.py -v
          python3 tests/translation-layer/test_native_archive_status.py -v
          python3 tests/translation-layer/test_lifecycle_resilience.py -v
          python3 tests/translation-layer/test_capture_consolidation.py -v
          python3 tests/translation-layer/test_archive_compatibility.py -v
          python3 tests/translation-layer/test_native_preparation_audit.py -v
          python3 tests/translation-layer/test_native_display.py -v
          python3 tests/translation-layer/test_upstream_native.py -v
          python3 tests/translation-layer/test_apk_order.py -v
          python3 tests/translation-layer/test_husk31_integration.py -v
          python3 tests/translation-layer/test_crash_diagnostics.py -v
          sh tests/translation-layer/run_font_paths.sh
          {
            echo "## Husk IPA source"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Sharp native-resolution and efficiency regression checks passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version

      - name: Ensure Metal compiler component
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="${RUNNER_TEMP}/husk-metal-compiler"
          mkdir -p "$probe_dir"
          printf '%s\n' '#include <metal_stdlib>' 'using namespace metal;' \
            'kernel void husk_probe(device uint* p [[buffer(0)]], uint i [[thread_position_in_grid]]) { p[i] = i; }' \
            > "$probe_dir/probe.metal"
          if ! xcrun --sdk iphoneos metal -c "$probe_dir/probe.metal" -o "$probe_dir/probe.air" > "$probe_dir/check.log" 2>&1; then
            cat "$probe_dir/check.log"
            xcodebuild -downloadComponent MetalToolchain
            xcrun --sdk iphoneos metal -c "$probe_dir/probe.metal" -o "$probe_dir/probe.air"
          fi
          test -s "$probe_dir/probe.air"

      - name: Download verified official base libraries and game resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --location --retry 3 \
            https://github.com/Leviidev/Husk/releases/download/3.0/Husk.ipa \
            --output build/Husk-3.0-base.ipa
          curl --fail --location --retry 3 \
            https://github.com/Leviidev/Husk/releases/download/3.1/Husk.ipa \
            --output build/Husk-3.1-base.ipa
          # Pin3.1 resources while retaining the tested3.0 QEMU/JIT library.
          python3 scripts/stage_graphics_build.py build/Husk-3.1-base.ipa build/Husk-3.0-base.ipa

      - name: Install Rust iOS target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Cache Rust pairing dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rppairing-ios/target
          key: husk-pairing-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/rppairing-ios/Cargo.lock') }}

      - name: Build pairing library
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_rppairing_ios.sh

      - name: Compile app before expensive experimental driver build
        shell: bash
        run: |
          set -euo pipefail
          cd src/app
          xcodegen generate --quiet
          mkdir -p /tmp/husk_ipa
          xcodebuild -project Husk.xcodeproj -scheme Husk -sdk iphoneos -configuration Release \
            -derivedDataPath /tmp/husk_ipa CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > /tmp/husk_ipa/build.log 2>&1 || { tail -100 /tmp/husk_ipa/build.log; exit 1; }
          grep 'BUILD SUCCEEDED' /tmp/husk_ipa/build.log

      - name: Build separate pinned MetalFX experimental driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bash scripts/build_spatial_moltenvk_ios.sh 2>&1 | tee build/logs/spatial-driver.log

      - name: Build this fork's Husk app and package IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package_ipa.sh "$PWD/build/Husk.ipa"
          test -s build/Husk.ipa
          ls -lh build/Husk.ipa

      - name: Upload the installable IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-LiveContainer-IPA
          path: build/Husk.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: husk-build-logs
          path: |
            /tmp/husk_ipa/build.log
            build/logs/
          if-no-files-found: ignore
          retention-days: 7
